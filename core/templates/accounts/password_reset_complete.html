{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Complete</title>
  <link rel="icon" type="image/x-icon" href="{% static 'icons/favicon.ico' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/password_flow.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'css/auth_theme.css' %}">
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="auth-brand"><img src="{% static 'icons/favicon.ico' %}" alt=""><span>Blue River Technology Solutions</span></div>
      <div class="auth-icon is-success"><i class="fas fa-circle-check"></i></div>
      <h2>Password Changed</h2>
      <p>Your password has been successfully reset. You can now log in with the new password.</p>
      <a href="{% url 'login' %}" class="btn">Login Now</a>
    </div>
  </div>
</body>
</html>
