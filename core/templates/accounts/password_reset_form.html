{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="icon" type="image/x-icon" href="{% static 'icons/favicon.ico' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/password_reset.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'css/auth_theme.css' %}">
</head>
<body>
  <div class="reset-wrapper">
    <div class="reset-card">
      <div class="auth-brand"><img src="{% static 'icons/favicon.ico' %}" alt=""><span>Blue River Technology Solutions</span></div>
      <div class="auth-icon"><i class="fas fa-key"></i></div>
      <h2>Password Reset</h2>
      <p>Enter your email and we'll send you instructions to reset your password.</p>
      <form method="POST">
        {% csrf_token %}
        {{ form.email.label_tag }}<br>
        {{ form.email }}
        <button type="submit" class="btn-reset">Send Reset Link</button>
      </form>
      <a href="{% url 'login' %}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>
</body>
</html>
