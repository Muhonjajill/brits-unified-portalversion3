{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify OTP</title>
  <link rel="icon" type="image/x-icon" href="{% static 'icons/favicon.ico' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/password_flow.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'css/auth_theme.css' %}">
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="auth-brand"><img src="{% static 'icons/favicon.ico' %}" alt=""><span>Blue River Technology Solutions</span></div>
      <div class="auth-icon"><i class="fas fa-shield-halved"></i></div>
      <h2>Kindly Enter OTP Sent To Your Email</h2>
      <form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn">Verify</button>
</form>
    </div>
  </div>
</body>
</html>
