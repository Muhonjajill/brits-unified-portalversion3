{% extends "files_base.html" %}
{% load static %}

{% block title %}Preview Not Available{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/unsupported_preview.css' %}">
<link rel="stylesheet" href="{% static 'css/files_theme.css' %}">
{% endblock %}

{% block content %}
<div class="page-container">
  <h3><span class="ft-icon"><i class="fas fa-eye-slash"></i></span> Preview Not Available</h3>
  <p>This file type cannot be previewed in the browser.</p>
  <a href="{% url 'download_file' file.id %}" download class="btn"><i class="fas fa-download"></i> Download File</a>
</div>
{% endblock %}
